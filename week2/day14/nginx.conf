# Reverse proxy in front of the Day 14 API.
# Terminates client HTTP, forwards to the app service with proxy headers so
# Express sees real IPs (rate limiter, monitoring logs depend on req.ip).
events {}

http {
  upstream api {
    server app:3000;
  }

  # Basic gzip for JSON API responses (compression middleware also gzips;
  # harmless duplication, nginx handles static/Second layer here).
  gzip on;
  gzip_types application/json;

  server {
    listen 80;
    # server_name your-domain.com;

    # Security headers (helmet also sets these; defense in depth)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # Lean liveness probe for load balancers (no auth, cheap)
    location = /health {
      proxy_pass http://api;
      access_log off;
    }
  }

  # HTTPS block (after certbot, see docs/deployment-guide.md):
  # server {
  #   listen 443 ssl;
  #   server_name your-domain.com;
  #   ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
  #   location / { proxy_pass http://api; ... }
  # }
}
