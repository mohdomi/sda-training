apiVersion: apps/v1
kind: Deployment
metadata:
  name: sda-training-app
  namespace: sda-training
  labels:
    app: sda-training
    component: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sda-training
      component: app
  template:
    metadata:
      labels:
        app: sda-training
        component: app
    spec:
      containers:
      - name: app
        image: sda-training:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: sda-training-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: sda-training-config
              key: PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sda-training-secrets
              key: JWT_SECRET
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: sda-training-secrets
              key: MONGODB_URI
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: sda-training-secrets
              key: POSTGRES_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: sda-training-secrets
              key: REDIS_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: app-uploads
          mountPath: /app/uploads
      volumes:
      - name: app-logs
        persistentVolumeClaim:
          claimName: app-logs-pvc
      - name: app-uploads
        persistentVolumeClaim:
          claimName: app-uploads-pvc
      restartPolicy: Always
