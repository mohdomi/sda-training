apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sda-training
  labels:
    app: sda-training
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sda-training
      component: monitoring
  template:
    metadata:
      labels:
        app: sda-training
        component: monitoring
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
          name: prometheus
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data-pvc
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: sda-training
  labels:
    app: sda-training
    component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: prometheus
  selector:
    app: sda-training
    component: monitoring
