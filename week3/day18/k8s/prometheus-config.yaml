apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sda-training
  labels:
    app: sda-training
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'app'
        static_configs:
          - targets: ['sda-training-service:3000']
        metrics_path: '/health'
        scrape_interval: 5s
