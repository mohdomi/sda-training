apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sda-training
  labels:
    app: sda-training
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sda-training
      component: redis
  template:
    metadata:
      labels:
        app: sda-training
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:6.0-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sda-training
  labels:
    app: sda-training
    component: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: sda-training
    component: redis
