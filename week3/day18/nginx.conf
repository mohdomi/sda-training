# Reverse proxy in front of the Day 14 API.
# Terminates client HTTP, forwards to the app service with proxy headers so
# Express sees real IPs (rate limiter, monitoring logs depend on req.ip).
events {}

http {
  upstream api {
    server app:3000;
  }

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  server {
    listen 80;
    # server_name your-domain.com;

    # Security headers (helmet also sets these; defense in depth)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
      limit_req zone=api burst=20 nodelay;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # Lean liveness probe for load balancers (no auth, cheap)
    location = /health {
      proxy_pass http://api;
      access_log off;
    }
  }

  # HTTPS block (after certbot, see docs/deployment-guide.md):
  # server {
  #   listen 443 ssl;
  #   server_name your-domain.com;
  #   ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
  #   location / { proxy_pass http://api; ... }
  # }
}
