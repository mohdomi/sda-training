services:
  backend:
    build: ../backend
    ports: ["5000:5000"]
    env_file: ../.env
    environment:
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build: ../frontend
    ports: ["5173:80"]
    depends_on: [backend]
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=sda_capstone
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
