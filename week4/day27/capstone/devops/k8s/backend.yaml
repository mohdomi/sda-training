apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-backend
  namespace: capstone
spec:
  replicas: 2
  selector:
    matchLabels: { app: capstone-backend }
  template:
    metadata:
      labels: { app: capstone-backend }
    spec:
      containers:
        - name: backend
          image: capstone-backend:latest
          ports: [{ containerPort: 5000 }]
          env:
            - { name: PORT, value: "5000" }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: capstone-secrets, key: OPENROUTER_API_KEY } }
          livenessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 5, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: capstone-backend, namespace: capstone }
spec:
  selector: { app: capstone-backend }
  ports: [{ port: 5000, targetPort: 5000 }]
