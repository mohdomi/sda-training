# Capstone frontend: static SPA + reverse proxy to the backend API.
# Same-origin /api keeps the frontend code proxy-free in production.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache hashed build assets; never cache the HTML shell.
  location ~* \.(js|css|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }

  # REST API + auth + OAuth callbacks
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s; # AI responses can take a while
  }

  # Socket.io realtime (websocket upgrade)
  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }

  # Backend deep health (handy for debugging through one port)
  location = /health {
    proxy_pass http://backend:5000;
  }

  # SPA fallback: React Router routes serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
